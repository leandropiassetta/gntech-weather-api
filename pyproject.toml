[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-ra --strict-config --strict-markers"
python_files = ["test_*.py"]
testpaths = ["weather/tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["weather/migrations"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

